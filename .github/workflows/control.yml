name: GARY Control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  dispatch:
    if: >
      github.event.issue.pull_request == false &&
      github.event.comment.author_association == 'MEMBER' &&
      startsWith(github.event.comment.body, '/gary ')
    runs-on: ubuntu-latest
    steps:
      - name: Parse command
        id: parse
        run: |
          BODY="${{ github.event.comment.body }}"
          CMD=$(echo "$BODY" | head -1 | sed 's|^/gary ||')
          echo "command=$CMD" >> "$GITHUB_OUTPUT"

      - name: Fast path — status
        if: steps.parse.outputs.command == 'status'
        run: |
          echo "Fetching status snapshot..."
          # Read directly from repo — no GCP needed
          exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build GARY
        run: go build -o gary ./cmd/gary

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GARY_WIF_PROVIDER }}
          service_account: ${{ secrets.GARY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run command
        id: run
        run: |
          COMMAND="${{ steps.parse.outputs.command }}"
          case "$COMMAND" in
            status)
              ./gary status
              ;;
            doctor)
              ./gary doctor
              ;;
            list)
              gcloud batch jobs list \
                --project=${{ secrets.GARY_GCP_PROJECT }} \
                --location=${{ secrets.GARY_GCP_REGION }} \
                --format="table(name,status.state,createTime)" \
                --limit=10
              ;;
            inspect\ *)
              JOB_NAME=$(echo "$COMMAND" | cut -d' ' -f2)
              gcloud batch jobs describe "$JOB_NAME" \
                --project=${{ secrets.GARY_GCP_PROJECT }} \
                --location=${{ secrets.GARY_GCP_REGION }} \
                --format="json(name,status,taskGroups)"
              ;;
            logs\ *)
              JOB_NAME=$(echo "$COMMAND" | cut -d' ' -f2)
              gcloud logging read \
                "logName=\"projects/${{ secrets.GARY_GCP_PROJECT }}/logs/batch_task_logs\" AND labels.job_name=\"$JOB_NAME\"" \
                --project=${{ secrets.GARY_GCP_PROJECT }} \
                --format="value(textPayload)" \
                --freshness=1h \
                --limit=50
              ;;
            cancel\ *)
              JOB_NAME=$(echo "$COMMAND" | cut -d' ' -f2)
              gcloud batch jobs cancel "$JOB_NAME" \
                --project=${{ secrets.GARY_GCP_PROJECT }} \
                --location=${{ secrets.GARY_GCP_REGION }}
              ;;
            *)
              echo "Unknown command: $COMMAND"
              exit 1
              ;;
          esac

      - name: Comment result
        uses: actions/github-script@v7
        with:
          script: |
            const output = `GARY // ${{ steps.parse.outputs.command }}

            \`\`\`
            ${{ steps.run.outputs.stdout || 'Command completed' }}
            \`\`\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
