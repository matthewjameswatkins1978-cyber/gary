name: GARY CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - simplify/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test-output.txt
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gary-ci-test-output
          path: test-output.txt
      - name: Vet
        run: go vet ./...
      - name: CLI surface
        run: |
          set -euo pipefail
          help="$(go run ./cmd/gary help 2>&1)"
          printf '%s\n' "$help"
          grep -q 'work <job.json>' <<<"$help"
          ! grep -q 'master       Run' <<<"$help"
          ! grep -q 'run-many' <<<"$help"

# This workflow never invokes `gary work`, Google Batch, Gemini, or any paid
# execution path. GARY remains administratively parked until the human says to
# unpark it.