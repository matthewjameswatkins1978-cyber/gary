name: GARY control

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: gary-control-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event.issue.user.login == 'matthewjameswatkins1978-cyber' &&
      github.event.sender.login == 'matthewjameswatkins1978-cyber' &&
      github.event.issue.title == 'GARY COMMAND' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    env:
      GARY_GCP_PROJECT: ${{ vars.GARY_GCP_PROJECT }}
      GARY_GCP_REGION: ${{ vars.GARY_GCP_REGION }}
      GARY_WIF_PROVIDER: ${{ vars.GARY_WIF_PROVIDER }}
      GARY_DISPATCH_SERVICE_ACCOUNT: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}
      GARY_MAX_COST_USD: "0.06"
    steps:
      - name: Refuse a repeated command
        id: idempotency
        uses: actions/github-script@v7
        with:
          script: |
            const marker = `<!-- gary-control-issue:${context.issue.number} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            core.setOutput("already_processed", comments.some((comment) => comment.body.includes(marker)) ? "true" : "false");

      - name: Create short-lived GARY GitHub App token
        id: gary-app
        if: steps.idempotency.outputs.already_processed != 'true' && vars.GARY_GITHUB_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GARY_GITHUB_APP_ID }}
          private-key: ${{ secrets.GARY_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        if: steps.idempotency.outputs.already_processed != 'true'
        with:
          token: ${{ steps.gary-app.outputs.token || github.token }}

      - uses: actions/setup-go@v5
        if: steps.idempotency.outputs.already_processed != 'true'
        with:
          go-version-file: go.mod

      - name: Require OIDC configuration
        if: steps.idempotency.outputs.already_processed != 'true'
        run: |
          set -euo pipefail
          test -n "$GARY_GCP_PROJECT"
          test -n "$GARY_GCP_REGION"
          test -n "$GARY_WIF_PROVIDER"
          test -n "$GARY_DISPATCH_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud with OIDC
        if: steps.idempotency.outputs.already_processed != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GARY_WIF_PROVIDER }}
          service_account: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.idempotency.outputs.already_processed != 'true'

      - name: Apply worker cost guard
        if: steps.idempotency.outputs.already_processed != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("cmd/gary/run.go")
          src = path.read_text()
          for old, new in [
              ("maxAttempts                = 3", "maxAttempts                = 2"),
              ("maxAttempts, true, defaultWorkerMaxRunSec", "maxAttempts, false, defaultWorkerMaxRunSec"),
              ('if attempt > 1 && lastPatch != "" {', 'if attempt > 1 && lastFailure != "" {'),
          ]:
              if old not in src:
                  raise SystemExit(f"cost guard anchor missing: {old}")
              src = src.replace(old, new)
          loop_anchor = "\tfor attempt := 1; attempt <= attemptLimit; attempt++ {\n"
          budget_block = '''\tfor attempt := 1; attempt <= attemptLimit; attempt++ {
\t\tif cfg.MaxCostUSD > 0 {
\t\t\testimated := EstimateJobCostForModel(model, attempt)
\t\t\tallowed, reason := BudgetCheck(cfg.MaxCostUSD, 0, estimated)
\t\t\tif !allowed {
\t\t\t\tlogPrintln(prefix, "  BUDGET_STOPPED: "+reason)
\t\t\t\tfinalStatus = "BUDGET_STOPPED"
\t\t\t\tbreak
\t\t\t}
\t\t}
'''
          if loop_anchor not in src:
              raise SystemExit("attempt loop anchor missing")
          src = src.replace(loop_anchor, budget_block, 1)
          repair_block = '''\t\tlogPrintln(prefix, "  GENERATING REPAIR BRIEF")
\t\tbrief, err := generateRepairBrief(cfg, job.Task, acceptanceStr, lastPatch, lastAcceptance, "")
\t\tif err != nil {
\t\t\tlogPrint(prefix, "  repair brief failed: %v", err)
\t\t\tlastFailure = fmt.Sprintf("Repair brief generation failed: %v\\n\\nPrevious failure:\\n%s", err, lastFailure)
\t\t\tcontinue
\t\t}
\t\trepairCount++
\t\tlogPrint(prefix, "  Cause: %s", brief.Cause)
\t\tlogPrint(prefix, "  Next:  %s", brief.NextAction)

\t\tlastFailure = formatRepairBrief(brief)
'''
          if repair_block not in src:
              raise SystemExit("repair brief block anchor missing")
          src = src.replace(repair_block, '\t\tlogPrintln(prefix, "  RETRYING WITH FAILURE EVIDENCE")\n', 1)
          path.write_text(src)
          PY
          grep -q 'maxAttempts                = 2' cmd/gary/run.go
          grep -q 'RETRYING WITH FAILURE EVIDENCE' cmd/gary/run.go
          go test ./cmd/gary ./internal/...

      - name: Execute bounded GARY command
        id: execute
        if: steps.idempotency.outputs.already_processed != 'true'
        env:
          GARY_GITHUB_TOKEN: ${{ steps.gary-app.outputs.token }}
        run: |
          set +e
          go run ./cmd/gary issue execute "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/gary-issue-result.json"
          exit_code=$?
          if [ ! -f "$RUNNER_TEMP/gary-issue-result.json" ]; then
            printf '{"ok":false,"close":true,"comment":"GARY // COMMAND FAILED\\nNo result record was produced."}\n' > "$RUNNER_TEMP/gary-issue-result.json"
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post GARY result and close command issue
        if: steps.idempotency.outputs.already_processed != 'true'
        uses: actions/github-script@v7
        env:
          GARY_RESULT_PATH: ${{ runner.temp }}/gary-issue-result.json
        with:
          script: |
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync(process.env.GARY_RESULT_PATH, "utf8"));
            const marker = `<!-- gary-control-issue:${context.issue.number} -->`;
            const text = String(result.comment || "GARY produced no comment.").replace(/```/g, "'''");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${marker}\n\`\`\`text\n${text}\n\`\`\``,
            });
            if (result.close) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: "closed",
                state_reason: result.ok ? "completed" : "not_planned",
              });
            }
