name: GARY inbox

on:
  push:
    branches: [master]
    paths:
      - "gary/inbox/pending/**"

permissions:
  contents: write
  id-token: write

concurrency:
  group: gary-inbox
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GARY_GCP_PROJECT: ${{ vars.GARY_GCP_PROJECT }}
      GARY_GCP_REGION: ${{ vars.GARY_GCP_REGION }}
      GARY_WIF_PROVIDER: ${{ vars.GARY_WIF_PROVIDER }}
      GARY_DISPATCH_SERVICE_ACCOUNT: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}
      GARY_MAX_COST_USD: "0.06"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require GitHub OIDC configuration
        run: |
          set -euo pipefail
          test -n "$GARY_GCP_PROJECT"
          test -n "$GARY_GCP_REGION"
          test -n "$GARY_WIF_PROVIDER"
          test -n "$GARY_DISPATCH_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GARY_WIF_PROVIDER }}
          service_account: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify GARY before paid dispatch
        run: |
          set -euo pipefail
          go test ./...
      - name: Dispatch pending jobs
        id: dispatch
        continue-on-error: true
        env:
          GARY_GITHUB_APP_ID: ${{ vars.GARY_GITHUB_APP_ID }}
          GARY_GITHUB_APP_INSTALLATION_ID: ${{ vars.GARY_GITHUB_APP_INSTALLATION_ID }}
          GARY_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GARY_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          go run ./cmd/gary inbox dispatch gary/inbox/pending

      - name: Record GARY status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "GARY inbox"
          git config user.email "gary@agent-yard.local"
          mkdir -p gary/inbox/status
          git add -A gary/inbox/status
          git diff --cached --quiet || git commit -m "GARY inbox status"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

      - name: Propagate dispatch failure
        if: steps.dispatch.outcome == 'failure'
        run: exit 1
