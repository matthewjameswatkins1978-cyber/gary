name: GARY inbox

on:
  push:
    branches: [master]
    paths:
      - "gary/inbox/pending/**"

permissions:
  contents: write
  id-token: write

concurrency:
  group: gary-inbox
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GARY_GCP_PROJECT: ${{ vars.GARY_GCP_PROJECT }}
      GARY_GCP_REGION: ${{ vars.GARY_GCP_REGION }}
      GARY_WIF_PROVIDER: ${{ vars.GARY_WIF_PROVIDER }}
      GARY_DISPATCH_SERVICE_ACCOUNT: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}
      GARY_MAX_COST_USD: "0.06"
    steps:
      - name: Create short-lived GARY GitHub App token
        id: gary-app
        if: vars.GARY_GITHUB_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GARY_GITHUB_APP_ID }}
          private-key: ${{ secrets.GARY_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.gary-app.outputs.token || github.token }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require GitHub OIDC configuration
        run: |
          set -euo pipefail
          test -n "$GARY_GCP_PROJECT"
          test -n "$GARY_GCP_REGION"
          test -n "$GARY_WIF_PROVIDER"
          test -n "$GARY_DISPATCH_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GARY_WIF_PROVIDER }}
          service_account: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Apply worker cost guard
        run: |
          set -euo pipefail
          python3 scripts/apply_runtime_cost_guard.py
          go test ./cmd/gary ./internal/...

      - name: Dispatch pending jobs
        id: dispatch
        continue-on-error: true
        env:
          GARY_GITHUB_TOKEN: ${{ steps.gary-app.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GARY_GITHUB_TOKEN"
          go run ./cmd/gary inbox dispatch gary/inbox/pending

      - name: Record GARY status
        if: always()
        run: |
          set -euo pipefail
          git checkout -- cmd/gary/run.go
          git config user.name "GARY inbox"
          git config user.email "gary@agent-yard.local"
          mkdir -p gary/inbox/status
          git add -A gary/inbox/status
          git diff --cached --quiet || git commit -m "GARY inbox status"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

      - name: Propagate dispatch failure
        if: steps.dispatch.outcome == 'failure'
        run: exit 1
