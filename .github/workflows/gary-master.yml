name: GARY master

on:
  push:
    branches: [master]
    paths:
      - "gary/master/pending/*.json"

permissions:
  contents: write
  id-token: write

concurrency:
  group: gary-master
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GARY_GCP_PROJECT: ${{ vars.GARY_GCP_PROJECT }}
      GARY_GCP_REGION: ${{ vars.GARY_GCP_REGION }}
      GARY_WIF_PROVIDER: ${{ vars.GARY_WIF_PROVIDER }}
      GARY_DISPATCH_SERVICE_ACCOUNT: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}
      GARY_MAX_COST_USD: "0.06"
      GARY_MAX_WORKERS: "2"
    steps:
      - name: Create short-lived GARY GitHub App token
        id: gary-app
        if: vars.GARY_GITHUB_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GARY_GITHUB_APP_ID }}
          private-key: ${{ secrets.GARY_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.gary-app.outputs.token || github.token }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require GCP configuration and cross-repo token
        env:
          GARY_GITHUB_TOKEN: ${{ steps.gary-app.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GARY_GCP_PROJECT"
          test -n "$GARY_GCP_REGION"
          test -n "$GARY_WIF_PROVIDER"
          test -n "$GARY_DISPATCH_SERVICE_ACCOUNT"
          test -n "$GARY_GITHUB_TOKEN"

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GARY_WIF_PROVIDER }}
          service_account: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify control-plane Google identity
        run: |
          set -euo pipefail
          gcloud auth print-access-token >/dev/null

      - name: Verify GARY before paid dispatch
        run: |
          set -euo pipefail
          go test ./...

      - name: Dispatch changed master jobs
        env:
          GARY_GITHUB_TOKEN: ${{ steps.gary-app.outputs.token }}
          GARY_PUSH_BEFORE: ${{ github.event.before }}
          GARY_PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GARY_GITHUB_TOKEN"
          mapfile -t manifests < <(git diff --name-only "$GARY_PUSH_BEFORE" "$GARY_PUSH_AFTER" -- 'gary/master/pending/*.json')
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No changed master manifests."
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            test -f "$manifest" || continue
            manifest_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$manifest")"
            status_file="gary/master/status/${manifest_id}.json"
            if [ -f "$status_file" ]; then
              state="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("state", ""))' "$status_file")"
              case "$state" in
                done|failed) ;;
                *)
                  echo "Refusing automatic restart of $manifest_id with existing non-final state: $state" >&2
                  exit 1
                  ;;
              esac
            fi
            echo "Dispatching $manifest"
            go run ./cmd/gary master "$manifest"
          done

      - name: Record master status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "GARY master"
          git config user.email "gary@agent-yard.local"
          status_snapshot="$(mktemp -d)"
          mapfile -t status_paths < <(
            { git diff --name-only HEAD -- gary/master/status; git diff --cached --name-only -- gary/master/status; git ls-files --others --exclude-standard -- gary/master/status; } | sort -u
          )
          if [ ${#status_paths[@]} -eq 0 ]; then
            echo "No local master status changes."
            exit 0
          fi
          for path in "${status_paths[@]}"; do
            test -f "$path" || continue
            mkdir -p "$status_snapshot/$(dirname "$path")"
            cp "$path" "$status_snapshot/$path"
          done

          # Publish from the newest master without rebasing a status commit.
          # If another run already wrote the same record, keep the record with
          # the newer valid UTC timestamp; never resolve that race by taking
          # the local file blindly.
          for attempt in 1 2 3; do
            git fetch origin master
            git clean -fd -- gary/master/status
            git reset --hard origin/master
            publish_paths=()
            for path in "${status_paths[@]}"; do
              local_file="$status_snapshot/$path"
              test -f "$local_file" || continue
              if [ -f "$path" ]; then
                if ! remote_updated="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("updated_at", ""))' "$path" 2>/dev/null)"; then
                  echo "Preserving invalid remote status $path" >&2
                  continue
                fi
                if [ -z "$remote_updated" ]; then
                  echo "Preserving remote status without updated_at $path" >&2
                  continue
                fi
                if ! local_updated="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("updated_at", ""))' "$local_file" 2>/dev/null)"; then
                  echo "Invalid local status $local_file" >&2
                  exit 1
                fi
                if [ -z "$local_updated" ]; then
                  echo "Local status lacks updated_at: $local_file" >&2
                  exit 1
                fi
                if [[ "$remote_updated" > "$local_updated" || "$remote_updated" == "$local_updated" ]]; then
                  echo "Preserving newer remote status $path"
                  continue
                fi
              fi
              mkdir -p "$(dirname "$path")"
              cp "$local_file" "$path"
              publish_paths+=("$path")
            done
            if [ ${#publish_paths[@]} -eq 0 ]; then
              echo "Remote master already contains the newest status records."
              exit 0
            fi
            git add -- "${publish_paths[@]}"
            if git diff --cached --quiet; then
              echo "Remote master already contains the status records."
              exit 0
            fi
            git commit -m "GARY: update master status"
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Master moved during status publish; retrying ($attempt/3)." >&2
          done
          echo "Unable to publish master status without overwriting newer master changes." >&2
          exit 1
