name: GARY master

on:
  push:
    branches: [master]
    paths:
      - "gary/master/pending/*.json"

permissions:
  contents: write
  id-token: write

concurrency:
  group: gary-master
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GARY_GCP_PROJECT: ${{ vars.GARY_GCP_PROJECT }}
      GARY_GCP_REGION: ${{ vars.GARY_GCP_REGION }}
      GARY_WIF_PROVIDER: ${{ vars.GARY_WIF_PROVIDER }}
      GARY_DISPATCH_SERVICE_ACCOUNT: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}
      GARY_MAX_COST_USD: "0.06"
      GARY_MAX_WORKERS: "2"
    steps:
      - name: Create short-lived GARY GitHub App token
        id: gary-app
        if: vars.GARY_GITHUB_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GARY_GITHUB_APP_ID }}
          private-key: ${{ secrets.GARY_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.gary-app.outputs.token || github.token }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require GCP configuration and cross-repo token
        env:
          GARY_GITHUB_TOKEN: ${{ steps.gary-app.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GARY_GCP_PROJECT"
          test -n "$GARY_GCP_REGION"
          test -n "$GARY_WIF_PROVIDER"
          test -n "$GARY_DISPATCH_SERVICE_ACCOUNT"
          test -n "$GARY_GITHUB_TOKEN"

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GARY_WIF_PROVIDER }}
          service_account: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify control-plane Google identity
        run: |
          set -euo pipefail
          gcloud auth print-access-token >/dev/null

      - name: Verify GARY before paid dispatch
        run: |
          set -euo pipefail
          go test ./...

      - name: Dispatch changed master jobs
        env:
          GARY_GITHUB_TOKEN: ${{ steps.gary-app.outputs.token }}
          GARY_PUSH_BEFORE: ${{ github.event.before }}
          GARY_PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GARY_GITHUB_TOKEN"
          mapfile -t manifests < <(git diff --name-only "$GARY_PUSH_BEFORE" "$GARY_PUSH_AFTER" -- 'gary/master/pending/*.json')
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No changed master manifests."
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            test -f "$manifest" || continue
            manifest_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$manifest")"
            status_file="gary/master/status/${manifest_id}.json"
            if [ -f "$status_file" ]; then
              state="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("state", ""))' "$status_file")"
              case "$state" in
                done|failed) ;;
                *)
                  echo "Refusing automatic restart of $manifest_id with existing non-final state: $state" >&2
                  exit 1
                  ;;
              esac
            fi
            echo "Dispatching $manifest"
            go run ./cmd/gary master "$manifest"
          done

      - name: Record master status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "GARY master"
          git config user.email "gary@agent-yard.local"
          mkdir -p gary/master/status
          git add -A gary/master/status
          git diff --cached --quiet || git commit -m "GARY: update master status"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
