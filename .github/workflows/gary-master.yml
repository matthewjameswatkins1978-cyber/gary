name: GARY master

on:
  push:
    branches: [master]
    paths:
      - "gary/master/pending/*.json"

permissions:
  contents: write
  id-token: write

concurrency:
  group: gary-master
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GARY_GCP_PROJECT: ${{ vars.GARY_GCP_PROJECT }}
      GARY_GCP_REGION: ${{ vars.GARY_GCP_REGION }}
      GARY_WIF_PROVIDER: ${{ vars.GARY_WIF_PROVIDER }}
      GARY_DISPATCH_SERVICE_ACCOUNT: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}
      GARY_MAX_COST_USD: "0.06"
      GARY_MAX_WORKERS: "3"
    steps:
      - name: Create short-lived GARY GitHub App token
        id: gary-app
        if: vars.GARY_GITHUB_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GARY_GITHUB_APP_ID }}
          private-key: ${{ secrets.GARY_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.gary-app.outputs.token || github.token }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Require GCP configuration and cross-repo token
        env:
          GARY_GITHUB_TOKEN: ${{ steps.gary-app.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$GARY_GCP_PROJECT"
          test -n "$GARY_GCP_REGION"
          test -n "$GARY_WIF_PROVIDER"
          test -n "$GARY_DISPATCH_SERVICE_ACCOUNT"
          test -n "$GARY_GITHUB_TOKEN"

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GARY_WIF_PROVIDER }}
          service_account: ${{ vars.GARY_DISPATCH_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Apply worker cost guard
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          run_path = Path("cmd/gary/run.go")
          src = run_path.read_text()
          replacements = [
              ("maxAttempts                = 3", "maxAttempts                = 2"),
              ("maxAttempts, true, defaultWorkerMaxRunSec", "maxAttempts, false, defaultWorkerMaxRunSec"),
              ('if attempt > 1 && lastPatch != "" {', 'if attempt > 1 && lastFailure != "" {'),
          ]
          for old, new in replacements:
              if old not in src:
                  raise SystemExit(f"cost guard anchor missing: {old}")
              src = src.replace(old, new)

          loop_anchor = "\tfor attempt := 1; attempt <= attemptLimit; attempt++ {\n"
          budget_block = '''\tfor attempt := 1; attempt <= attemptLimit; attempt++ {
\t\tif cfg.MaxCostUSD > 0 {
\t\t\testimated := EstimateJobCostForModel(model, attempt)
\t\t\tallowed, reason := BudgetCheck(cfg.MaxCostUSD, 0, estimated)
\t\t\tif !allowed {
\t\t\t\tlogPrintln(prefix, "  BUDGET_STOPPED: "+reason)
\t\t\t\tfinalStatus = "BUDGET_STOPPED"
\t\t\t\tbreak
\t\t\t}
\t\t}
'''
          if loop_anchor not in src:
              raise SystemExit("attempt loop anchor missing")
          src = src.replace(loop_anchor, budget_block, 1)

          repair_block = '''\t\tlogPrintln(prefix, "  GENERATING REPAIR BRIEF")
\t\tbrief, err := generateRepairBrief(cfg, job.Task, acceptanceStr, lastPatch, lastAcceptance, "")
\t\tif err != nil {
\t\t\tlogPrint(prefix, "  repair brief failed: %v", err)
\t\t\tlastFailure = fmt.Sprintf("Repair brief generation failed: %v\\n\\nPrevious failure:\\n%s", err, lastFailure)
\t\t\tcontinue
\t\t}
\t\trepairCount++
\t\tlogPrint(prefix, "  Cause: %s", brief.Cause)
\t\tlogPrint(prefix, "  Next:  %s", brief.NextAction)

\t\tlastFailure = formatRepairBrief(brief)
'''
          if repair_block not in src:
              raise SystemExit("repair brief block anchor missing")
          src = src.replace(repair_block, '\t\tlogPrintln(prefix, "  RETRYING WITH FAILURE EVIDENCE")\n', 1)
          run_path.write_text(src)

          master_path = Path("cmd/gary/master.go")
          master = master_path.read_text()
          worker_block = '''\tif m.MaxWorkers == 0 {
\t\tm.MaxWorkers = masterWorkerLimit()
\t}
\tif m.MaxWorkers < 1 || m.MaxWorkers > 8 {
'''
          worker_guard = '''\tworkerLimit := masterWorkerLimit()
\tif m.MaxWorkers == 0 || m.MaxWorkers > workerLimit {
\t\tm.MaxWorkers = workerLimit
\t}
\tif m.MaxWorkers < 1 || m.MaxWorkers > 8 {
'''
          if worker_block not in master:
              raise SystemExit("master worker-limit anchor missing")
          master = master.replace(worker_block, worker_guard, 1)
          master_path.write_text(master)
          PY

          grep -q 'maxAttempts                = 2' cmd/gary/run.go
          test "$(grep -c 'maxAttempts, false, defaultWorkerMaxRunSec' cmd/gary/run.go)" -ge 2
          grep -q 'if attempt > 1 && lastFailure != ""' cmd/gary/run.go
          grep -q 'RETRYING WITH FAILURE EVIDENCE' cmd/gary/run.go
          grep -q 'm.MaxWorkers > workerLimit' cmd/gary/master.go
          if grep -q 'GENERATING REPAIR BRIEF' cmd/gary/run.go; then
            echo "Paid repair-brief path still active" >&2
            exit 1
          fi
          go test ./cmd/gary ./internal/...

      - name: Dispatch changed master jobs
        env:
          GARY_GITHUB_TOKEN: ${{ steps.gary-app.outputs.token }}
          GARY_PUSH_BEFORE: ${{ github.event.before }}
          GARY_PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GARY_GITHUB_TOKEN"
          mapfile -t manifests < <(git diff --name-only "$GARY_PUSH_BEFORE" "$GARY_PUSH_AFTER" -- 'gary/master/pending/*.json')
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No changed master manifests."
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            test -f "$manifest" || continue
            manifest_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$manifest")"
            status_file="gary/master/status/${manifest_id}.json"
            if [ -f "$status_file" ]; then
              state="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("state", ""))' "$status_file")"
              case "$state" in
                done|failed) ;;
                *)
                  echo "Refusing automatic restart of $manifest_id with existing non-final state: $state" >&2
                  exit 1
                  ;;
              esac
            fi
            echo "Dispatching $manifest"
            go run ./cmd/gary master "$manifest"
          done

      - name: Record master status
        if: always()
        run: |
          set -euo pipefail
          git checkout -- cmd/gary/run.go cmd/gary/master.go
          git config user.name "GARY master"
          git config user.email "gary@agent-yard.local"
          mkdir -p gary/master/status
          git add -A gary/master/status
          git diff --cached --quiet || git commit -m "GARY: update master status"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
