name: temporary branch verification

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/tmp-branch-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-first-handover
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
