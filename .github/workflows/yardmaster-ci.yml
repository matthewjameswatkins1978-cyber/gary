name: Yardmaster CI

on:
  push:
    branches:
      - feature/master-yardmaster
    paths:
      - "cmd/gary/**"
      - "internal/batch/**"
      - "internal/config/**"
      - "internal/gitops/**"
      - ".github/workflows/yardmaster-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
